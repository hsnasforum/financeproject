name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_INSTALL_ATTEMPTS: "1"
  PLAYWRIGHT_INSTALL_TIMEOUT_MS: "900000"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "file:./prisma/ci.db"

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm prisma:generate

      - name: Prisma db push
        run: pnpm exec prisma db push

      - name: Verify (lint/schema/rules)
        run: pnpm validate:dumps:fixtures && pnpm data:doctor && pnpm dart:rules:gate && pnpm lint && pnpm typecheck:planning && pnpm planning:v2:engine:guard && pnpm planner:deprecated:guard && pnpm components:app-import:guard

      - name: Install Playwright Chromium (for planning:v2:complete)
        run: pnpm e2e:install:chromium

      - name: Required Gate - Release Verify (quality gate registry)
        run: pnpm release:verify

      - name: Build
        run: pnpm build

      - name: Desktop artifact provenance gate
        run: |
          pnpm planning:v2:desktop:build -- --no-next-build
          test -z "$(git ls-files '.dist/**')"
          test -f .dist/planning-v2-desktop/desktop-manifest.json
          install_root="$(mktemp -d)"
          pnpm planning:v2:desktop:install -- --skip-install --from=.dist/planning-v2-desktop --to="$install_root/planning-v2-desktop"
