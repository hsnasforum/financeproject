name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 make g++

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build desktop artifact
        run: pnpm planning:v2:desktop:build

      - name: Write desktop artifact inventory
        run: find .dist/planning-v2-desktop -type f | sort > planning-v2-desktop-${{ github.ref_name }}.inventory.txt

      - name: Pack desktop artifact
        run: tar -czf planning-v2-desktop-${{ github.ref_name }}.tar.gz -C .dist planning-v2-desktop

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            planning-v2-desktop-${{ github.ref_name }}.tar.gz
            planning-v2-desktop-${{ github.ref_name }}.inventory.txt
