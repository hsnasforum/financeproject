name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify_and_package:
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "file:./prisma/release.db"
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: "9.15.9"

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.2"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Validate tag source and clean inputs
        run: |
          git check-ref-format "refs/tags/${GITHUB_REF_NAME}"
          git check-ref-format --branch "${DEFAULT_BRANCH}"
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          node scripts/release_tag_guard.mjs \
            --sha="${GITHUB_SHA}" \
            --tag="${GITHUB_REF_NAME}" \
            --default-branch="${DEFAULT_BRANCH}" \
            --verify-remote-tag=true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare database and browser
        run: |
          pnpm prisma:generate
          pnpm prisma:db:push
          pnpm e2e:install:chromium

      - name: Required release verification
        run: pnpm release:verify

      - name: Revalidate clean source after required gates
        run: |
          node scripts/release_tag_guard.mjs \
            --sha="${GITHUB_SHA}" \
            --tag="${GITHUB_REF_NAME}" \
            --default-branch="${DEFAULT_BRANCH}"

      - name: Build desktop artifact
        run: pnpm planning:v2:desktop:build

      - name: Install and smoke published desktop artifact
        shell: pwsh
        # The smoke scripts create their SQLite files under the OS temp directory, which must be
        # on the install volume (RUNNER_TEMP, D:) because desktop-local rejects cross-volume databases.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          $installRoot = Join-Path $env:RUNNER_TEMP "planning-v2-desktop-release"
          $env:PLANNING_DESKTOP_INSTALL_DIR = $installRoot
          $env:PLANNING_DESKTOP_SKIP_SHORTCUTS = "1"
          Push-Location .dist/planning-v2-desktop
          cmd.exe /d /c install.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          pnpm planning:v2:prod:smoke -- --app-dir="$installRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm planning:v2:desktop:smoke -- --use-installed-database --app-dir="$installRoot"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Push-Location $installRoot
          cmd.exe /d /c uninstall.cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          if (Test-Path -LiteralPath (Join-Path $installRoot "package.json")) {
            throw "desktop uninstall left package binaries behind"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot ".env.local"))) {
            throw "desktop uninstall removed the local environment"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installRoot "prisma\dev.db"))) {
            throw "desktop uninstall removed the SQLite database"
          }

      - name: Revalidate clean source after desktop build
        run: |
          node scripts/release_tag_guard.mjs \
            --sha="${GITHUB_SHA}" \
            --tag="${GITHUB_REF_NAME}" \
            --default-branch="${DEFAULT_BRANCH}"

      - name: Build release provenance
        run: |
          node scripts/release_artifact_provenance.mjs \
            --mode=create \
            --artifact-dir=.dist/planning-v2-desktop \
            --archive="planning-v2-desktop-${GITHUB_REF_NAME}.tar.gz" \
            --inventory="planning-v2-desktop-${GITHUB_REF_NAME}.inventory.json" \
            --manifest="planning-v2-desktop-${GITHUB_REF_NAME}.manifest.json" \
            --source-sha="${GITHUB_SHA}" \
            --tag="${GITHUB_REF_NAME}"

      - name: Upload verified release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: planning-v2-desktop-release-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: |
            planning-v2-desktop-${{ github.ref_name }}.tar.gz
            planning-v2-desktop-${{ github.ref_name }}.inventory.json
            planning-v2-desktop-${{ github.ref_name }}.manifest.json

  publish:
    needs: verify_and_package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22.22.2"

      - name: Revalidate remote tag before publish
        run: |
          git check-ref-format "refs/tags/${GITHUB_REF_NAME}"
          git check-ref-format --branch "${DEFAULT_BRANCH}"
          git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          node scripts/release_tag_guard.mjs \
            --sha="${GITHUB_SHA}" \
            --tag="${GITHUB_REF_NAME}" \
            --default-branch="${DEFAULT_BRANCH}" \
            --verify-remote-tag=true

      - name: Block existing GitHub Release overwrite
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release_existing_release_guard.mjs

      - name: Download verified release bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: planning-v2-desktop-release-${{ github.run_id }}
          path: .release

      - name: Verify downloaded release provenance
        run: |
          node scripts/release_artifact_provenance.mjs \
            --mode=verify \
            --manifest=".release/planning-v2-desktop-${GITHUB_REF_NAME}.manifest.json" \
            --source-sha="${GITHUB_SHA}" \
            --tag="${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: false
          files: |
            .release/planning-v2-desktop-${{ github.ref_name }}.tar.gz
            .release/planning-v2-desktop-${{ github.ref_name }}.inventory.json
            .release/planning-v2-desktop-${{ github.ref_name }}.manifest.json
