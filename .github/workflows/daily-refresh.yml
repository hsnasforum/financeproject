name: Daily Refresh

on:
  schedule:
    - cron: "5 0 * * *" # 00:05 UTC = 09:05 KST
  workflow_dispatch: {}

concurrency:
  group: daily-refresh-${{ github.repository }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Validate refresh configuration
        id: preflight
        env:
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
          FINLIFE_TOPFIN_GRP_LIST: ${{ secrets.FINLIFE_TOPFIN_GRP_LIST }}
          KDB_DATAGO_SERVICE_KEY: ${{ secrets.KDB_DATAGO_SERVICE_KEY }}
          DATAGO_SERVICE_KEY: ${{ secrets.DATAGO_SERVICE_KEY }}
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          EXIM_EXCHANGE_API_KEY: ${{ secrets.EXIM_EXCHANGE_API_KEY }}
          EXIM_EXCHANGE_API_URL: ${{ secrets.EXIM_EXCHANGE_API_URL }}
          MOIS_BENEFITS_API_KEY: ${{ secrets.MOIS_BENEFITS_API_KEY }}
          MOIS_BENEFITS_API_URL: ${{ secrets.MOIS_BENEFITS_API_URL }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
        run: node scripts/daily_refresh_ci.mjs --check-env

      - name: Run daily refresh
        id: refresh
        env:
          FINLIFE_API_KEY: ${{ secrets.FINLIFE_API_KEY }}
          FINLIFE_TOPFIN_GRP_LIST: ${{ secrets.FINLIFE_TOPFIN_GRP_LIST }}
          KDB_DATAGO_SERVICE_KEY: ${{ secrets.KDB_DATAGO_SERVICE_KEY }}
          DATAGO_SERVICE_KEY: ${{ secrets.DATAGO_SERVICE_KEY }}
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          KOSIS_API_KEY: ${{ secrets.KOSIS_API_KEY }}
          EXIM_EXCHANGE_API_KEY: ${{ secrets.EXIM_EXCHANGE_API_KEY }}
          EXIM_EXCHANGE_API_URL: ${{ secrets.EXIM_EXCHANGE_API_URL }}
          MOIS_BENEFITS_API_KEY: ${{ secrets.MOIS_BENEFITS_API_KEY }}
          MOIS_BENEFITS_API_URL: ${{ secrets.MOIS_BENEFITS_API_URL }}
          OPENDART_API_KEY: ${{ secrets.OPENDART_API_KEY }}
          OPENDART_BASE_URL: "https://opendart.fss.or.kr"
        run: pnpm daily:refresh:strict

      - name: Validate refresh result and build evidence
        id: evidence
        if: always()
        run: |
          node scripts/daily_refresh_ci.mjs \
            --result=tmp/daily_refresh_result.json \
            --evidence=tmp/daily_refresh_evidence.json \
            --pr-body="${RUNNER_TEMP}/daily_refresh_pr_body.md"

      - name: Upload artifacts
        id: artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: daily-refresh-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            tmp/daily_refresh_result.json
            tmp/daily_refresh.log
            tmp/daily_refresh_evidence.json
            ${{ runner.temp }}/daily_refresh_pr_body.md
            tmp/dart/disclosure_state.json
            tmp/dart/disclosure_digest.json
            tmp/dart/disclosure_alerts.json
            tmp/dart/daily_brief.json
            .data/benefits_snapshot.json
            .data/benefits_snapshot_partial.json
            .data/exchange_snapshot.json
            .data/finlife_credit-loan_snapshot.json
            .data/finlife_deposit_snapshot.json
            .data/finlife_mortgage-loan_snapshot.json
            .data/finlife_pension_snapshot.json
            .data/finlife_rent-house-loan_snapshot.json
            .data/finlife_saving_snapshot.json
            docs/dart-daily-brief.md
            docs/dart-disclosure-alerts.md
            docs/dart-disclosure-digest.md
            docs/data-freshness-report.md
            docs/schema-drift-report.md

      - name: Create refresh pull request
        id: create_pr
        if: ${{ !cancelled() && steps.preflight.outcome == 'success' && steps.refresh.outcome == 'success' && steps.evidence.outcome == 'success' && steps.evidence.outputs.ok == 'true' && steps.artifacts.outcome == 'success' }}
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          commit-message: "chore(daily): refresh generated outputs"
          branch: "chore/daily-refresh"
          base: ${{ github.event.repository.default_branch }}
          delete-branch: false
          title: "chore(daily): refresh generated outputs"
          body-path: ${{ runner.temp }}/daily_refresh_pr_body.md
          add-paths: |
            .data/benefits_snapshot.json
            .data/exchange_snapshot.json
            .data/finlife_credit-loan_snapshot.json
            .data/finlife_deposit_snapshot.json
            .data/finlife_mortgage-loan_snapshot.json
            .data/finlife_pension_snapshot.json
            .data/finlife_rent-house-loan_snapshot.json
            .data/finlife_saving_snapshot.json
            docs/dart-daily-brief.md
            docs/dart-disclosure-alerts.md
            docs/dart-disclosure-digest.md
            docs/data-freshness-report.md
            docs/schema-drift-report.md
          labels: |
            automated
            daily-refresh

      - name: PR result
        if: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          echo "Daily refresh PR: ${{ steps.create_pr.outputs.pull-request-url }}"
