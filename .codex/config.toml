#:schema https://developers.openai.com/codex/config-schema.json

model = "gpt-6-astra"
model_reasoning_effort = "ultra"
project_doc_max_bytes = 32768

[features]
multi_agent = true

[skills]

[[skills.config]]
path = "/home/xpdlqj/code/finance/.codex/skills/planning-gate-selector/SKILL.md"
enabled = true

[[skills.config]]
path = "/home/xpdlqj/code/finance/.codex/skills/work-log-closeout/SKILL.md"
enabled = true

[[skills.config]]
path = "/home/xpdlqj/code/finance/.codex/skills/route-ssot-check/SKILL.md"
enabled = true

[[skills.config]]
path = "/home/xpdlqj/code/finance/.codex/skills/dart-data-source-hardening/SKILL.md"
enabled = true

[[skills.config]]
path = "/home/xpdlqj/code/finance/.codex/skills/planning-v3-batch-contract-narrowing/SKILL.md"
enabled = true

[[skills.config]]
path = "/home/xpdlqj/code/finance/.codex/skills/codex-agent-rules-maintenance/SKILL.md"
enabled = true

[[skills.config]]
path = "/home/xpdlqj/.codex/skills/frontend-skill/SKILL.md"
enabled = true

[[skills.config]]
path = "/home/xpdlqj/code/finance/.codex/skills/finance-skill-routing/SKILL.md"
enabled = true

[agents]
enabled = true
max_concurrent_threads_per_session = 6
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "max"
max_depth = 1
job_max_runtime_seconds = 1800

[agents.manager]
description = "필요한 독립 작업의 분해와 소유권·통합 조건 제안"
config_file = "agents/manager.toml"

[agents.analyzer]
description = "실행 경로, 최초 실패, 영향 범위 조사"
config_file = "agents/analyzer.toml"

[agents.planner]
description = "최소 설계와 관찰 가능한 완료 조건 정의"
config_file = "agents/planner.toml"

[agents.developer]
description = "할당 파일의 최소 구현과 가까운 검증"
config_file = "agents/developer.toml"

[agents.reviewer]
description = "버그·회귀·안전·검증 공백 독립 검토"
config_file = "agents/reviewer.toml"

[agents.tester]
description = "충돌 없는 타깃 검사와 작은 재현"
config_file = "agents/tester.toml"

[agents.documenter]
description = "확인된 변경·검증의 문서화"
config_file = "agents/documenter.toml"

[agents.researcher]
description = "공식 외부 근거와 기준 시점 조사"
config_file = "agents/researcher.toml"
